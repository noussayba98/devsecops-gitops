apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: node-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/noussayba98/devsecops-gitops.git
    targetRevision: main
    path: apps/node-service/base

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
